preprocessing:
  excluded_events:
    - "prince-toronto-all-rnr-threads"
    - "ebola-essien-all-rnr-threads"
  min_nodes: 3

features:
  use_nlp: false      # ABLATION: NLP embeddings removed — model must rely on graph structure only
  use_followers: true
  use_verified: true
  use_pagerank: true
  use_degree: true
  use_indegree: true
  use_outdegree: true
  use_root: true
  use_depth: true

experiments:
  random_forest:
    model_type: "rf"
    n_estimators: 100
    max_depth: 10
    random_state: 42

  mlp_baseline:
    model_type: "mlp"
    hidden_dims: [64, 32]
    learning_rate: 0.001
    epochs: 100
    dropout: 0.5
    weight_decay: 0.0001

  gnn_simple:
    model_type: "gnn"
    hidden_dims: [64, 32]
    learning_rate: 0.001
    epochs: 100
    dropout: 0.5
    weight_decay: 0.0001

  gat_regularized:
    model_type: "gat"
    hidden_dims: [64, 32]
    heads: 2
    learning_rate: 0.001
    epochs: 100
    dropout: 0.6
    weight_decay: 0.001
