preprocessing:
  excluded_events:
    - "prince-toronto-all-rnr-threads"
    - "ebola-essien-all-rnr-threads"
    - "ferguson-all-rnr-threads"
  min_nodes: 3

features:
  use_nlp: true
  use_followers: true
  use_verified: true
  use_pagerank: true
  use_degree: true
  use_indegree: true
  use_outdegree: true
  use_root: true
  use_depth: true

# edge_direction controls how cascade edges are presented to the GNN layers.
# Raw PHEME edges go from root tweet → reply (top-down, parent-to-child).
#
#   original     — keep as-is; information flows root→replies only.
#                  The root tweet never receives any reply signals (weakest option).
#
#   inverted     — reverse all edges so they go reply→root (bottom-up).
#                  Every reply propagates its signal upward toward the root.
#                  Good for tasks where the root's representation should aggregate
#                  what its subtree says about it.
#
#   bidirectional — add reverse edges alongside the originals (undirected graph).
#                  Information flows both ways. Current default; gave the best
#                  overall F1 in our experiments but can confuse GAT attention
#                  on structurally atypical events (e.g. ferguson).
#
# Only applies to improved_gnn and improved_gat. Ignored by gnn, gat, mlp, rf.

experiments:
  improved_gnn:
    model_type: "improved_gnn"
    edge_direction: "bidirectional"   # original | inverted | bidirectional
    hidden_dims: [128, 64]
    learning_rate: 0.001
    epochs: 150
    dropout: 0.4
    weight_decay: 0.0001

  improved_gat:
    model_type: "improved_gat"
    edge_direction: "bidirectional"   # original | inverted | bidirectional
    hidden_dims: [128, 64]
    heads: 2
    learning_rate: 0.001
    epochs: 150
    dropout: 0.4
    weight_decay: 0.0001
