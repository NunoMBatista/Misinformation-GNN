features:
  use_nlp: true
  use_followers: true
  use_verified: true
  use_pagerank: true
  use_degree: true
  use_indegree: true
  use_outdegree: true

experiments:
  random_forest:
    model_type: "rf"
    n_estimators: 100
    max_depth: 10
    random_state: 42
  
  mlp_baseline:
    model_type: "mlp"
    hidden_dims: [64, 32]
    learning_rate: 0.001
    epochs: 50
    dropout: 0.5
    weight_decay: 0.0001

  gnn_simple:
    model_type: "gnn"
    hidden_dims: [64, 32]
    learning_rate: 0.001
    epochs: 50
    dropout: 0.5
    weight_decay: 0.0001