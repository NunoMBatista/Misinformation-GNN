preprocessing:
  excluded_events:
    - "prince-toronto-all-rnr-threads"
    - "ebola-essien-all-rnr-threads"
  min_nodes: 3

# Structural only: user metadata + graph topology = 10 dims
# followers + verified + PageRank + degree + in/out-degree + is_root + depth
# No text — tests whether network structure + user signals alone are discriminative
features:
  use_nlp: false
  use_followers: true
  use_verified: true
  use_pagerank: true
  use_degree: true
  use_indegree: true
  use_outdegree: true
  use_root: true
  use_depth: true

experiments:
  rf:
    model_type: "rf"
    n_estimators: 100
    max_depth: 10
    random_state: 42

  mlp:
    model_type: "mlp"
    hidden_dims: [32, 16]
    learning_rate: 0.001
    epochs: 100
    dropout: 0.3
    weight_decay: 0.0001
    use_focal_loss: true
    focal_gamma: 2.0

  gnn:
    model_type: "improved_gnn"
    edge_direction: "bidirectional"
    hidden_dims: [32, 16]
    learning_rate: 0.001
    epochs: 150
    dropout: 0.3
    weight_decay: 0.0001
    use_focal_loss: true
    focal_gamma: 2.0

  gat:
    model_type: "improved_gat"
    edge_direction: "bidirectional"
    hidden_dims: [32, 16]
    heads: 2
    learning_rate: 0.001
    epochs: 150
    dropout: 0.3
    weight_decay: 0.0001
    use_focal_loss: true
    focal_gamma: 2.0

  gin:
    model_type: "gin"
    edge_direction: "bidirectional"
    hidden_dims: [32, 16]
    learning_rate: 0.001
    epochs: 150
    dropout: 0.3
    weight_decay: 0.0001
    use_focal_loss: true
    focal_gamma: 2.0
